<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simplified Google Keep clone built with HTML, CSS and vanilla JavaScript." />
  <title>Keep Clone</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===== Top bar ===== -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="menu-toggle" aria-label="Toggle navigation" data-tooltip="Main menu">
      <span class="material-icon" aria-hidden="true">&#9776;</span>
    </button>
    <h1 class="brand"><span class="brand__logo" aria-hidden="true">&#128161;</span> Keep Clone</h1>

    <form class="search" id="search-form" role="search" onsubmit="return false">
      <label for="search-input" class="visually-hidden">Search notes</label>
      <input type="search" id="search-input" class="search__input" placeholder="Search notes" autocomplete="off" />
    </form>

    <div class="topbar__actions">
      <button class="icon-btn" id="view-toggle" aria-label="Switch between grid and list view" data-tooltip="List view">
        <span aria-hidden="true" id="view-toggle-icon">&#9776;</span>
      </button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" data-tooltip="Dark mode">
        <span aria-hidden="true" id="theme-toggle-icon">&#9790;</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" id="sidebar" aria-label="Note categories">
      <ul class="sidebar__list">
        <li>
          <button class="sidebar__item is-active" id="nav-notes" data-view="notes" aria-current="page">
            <span aria-hidden="true">&#128221;</span><span class="sidebar__label">Notes</span>
            <span class="badge" id="count-notes">0</span>
          </button>
        </li>
        <li>
          <button class="sidebar__item" id="nav-archive" data-view="archive">
            <span aria-hidden="true">&#128230;</span><span class="sidebar__label">Archive</span>
            <span class="badge" id="count-archive">0</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- ===== Main content ===== -->
    <main class="main" id="main">

      <!-- Note composer -->
      <section class="composer" id="composer" aria-label="Create a note">
        <form class="composer__form" id="note-form" autocomplete="off">
          <input type="text" id="note-title" class="composer__title" placeholder="Title" maxlength="100" aria-label="Note title" hidden />
          <textarea id="note-body" class="composer__body" rows="1" placeholder="Take a note..." aria-label="Note content"></textarea>

          <div class="composer__toolbar" id="composer-toolbar" hidden>
            <div class="color-picker" id="composer-colors" role="radiogroup" aria-label="Note colour"></div>
            <div class="composer__buttons">
              <button type="button" class="btn btn--text" id="composer-cancel">Cancel</button>
              <button type="submit" class="btn btn--primary" id="composer-add">Add note</button>
            </div>
          </div>
        </form>
      </section>

      <h2 class="section-title" id="section-title">Notes</h2>

      <!-- Notes grid -->
      <section class="notes" id="notes-container" aria-live="polite"></section>

      <!-- Empty state -->
      <div class="empty" id="empty-state" hidden>
        <div class="empty__icon" id="empty-icon" aria-hidden="true">&#128161;</div>
        <p class="empty__text" id="empty-text">Notes you add appear here</p>
      </div>
    </main>
  </div>

  <!-- ===== Edit modal ===== -->
  <div class="modal" id="note-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog" id="modal-dialog">
      <input type="text" id="modal-title" class="modal__title" placeholder="Title" maxlength="100" aria-label="Edit title" />
      <textarea id="modal-body" class="modal__body" placeholder="Note" aria-label="Edit content"></textarea>
      <div class="modal__footer">
        <div class="color-picker" id="modal-colors" role="radiogroup" aria-label="Note colour"></div>
        <span class="modal__meta" id="modal-meta"></span>
        <button type="button" class="btn btn--text" id="modal-close">Close</button>
      </div>
    </div>
  </div>

  <!-- ===== Toast (snackbar) ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button class="toast__action" id="toast-undo" type="button">Undo</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
